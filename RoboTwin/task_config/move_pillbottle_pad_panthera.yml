# Ten-episode Panthera six-DOF collection.
render_freq: 0
episode_num: 10
use_seed: false
save_freq: 15
embodiment: [panthera-6dof, panthera-6dof, 0.60]
panthera_mode: true
panthera_pad_y_lim: [-0.05, 0.10]
panthera_side_contact_height: 0.90
panthera_side_candidate_skip: 1
language_num: 1
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.6
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: true
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D405
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
